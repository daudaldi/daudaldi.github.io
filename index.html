<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Public Tools | Daud Aldumy</title>
  <meta name="description"
    content="Cybersecurity & Privacy Tools by Daud Aldumy. Secure, client-side, and privacy-focused utilities." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    :root {
      /* Light Mode Tokens */
      --bg: #f8fafc;
      --panel: #ffffff;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-glow: rgba(37, 99, 235, 0.1);
      --accent: #0ea5e9;
      --success: #10b981;
      --card-hover: #f1f5f9;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
      --font-head: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    [data-theme="dark"] {
      /* Dark Mode Tokens */
      --bg: #020617;
      --panel: #0f172a;
      --border: #1e293b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.15);
      --accent: #38bdf8;
      --success: #34d399;
      --card-hover: #1e293b;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text-main);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      transition: background 0.3s ease, color 0.3s ease;
      overflow: hidden;
      /* App-like feel */
    }

    /* --- Header --- */
    header {
      height: 64px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      z-index: 50;
      transition: border-color 0.3s ease, background 0.3s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: white;
      font-size: 1.1rem;
    }

    .theme-toggle {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 40px;
      height: 40px;
      border-radius: 10px;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 1.2rem;
      transition: all 0.2s;
    }

    .theme-toggle:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--primary-glow);
    }

    /* --- Main Layout --- */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* --- Sidebar --- */
    aside {
      width: 320px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 40;
    }

    .search-box {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .tool-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 16px 16px;
      /* Padding bottom for scroll */
      display: flex;
      flex-direction: column;
      gap: 4px;
      /* Tighter gap */
    }

    .tool-category {
      padding: 20px 8px 8px 8px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
      font-family: var(--font-head);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tool-category::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
      opacity: 0.5;
    }

    .tool-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
    }

    .tool-item:hover {
      background: var(--card-hover);
    }

    .tool-item.active {
      background: var(--primary-glow);
      border-color: rgba(37, 99, 235, 0.1);
    }

    .tool-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .tool-item.active .tool-icon {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .tool-info {
      flex: 1;
      min-width: 0;
    }

    .tool-name {
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--text-main);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* --- Content Area --- */
    main {
      flex: 1;
      position: relative;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .content-header {
      padding: 16px 24px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .content-title {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-main);
    }

    .action-btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text-main);
    }

    .action-btn:hover {
      background: var(--card-hover);
      border-color: var(--text-muted);
    }

    .action-btn.primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .action-btn.primary:hover {
      background: #1d4ed8;
      /* darker blue */
    }

    /* --- Iframe & About --- */
    .frame-container {
      flex: 1;
      position: relative;
      width: 100%;
      background: var(--bg);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .about-section {
      padding: 40px;
      max-width: 1000px;
      margin: 0 auto;
      overflow-y: auto;
      height: 100%;
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      font-family: var(--font-head);
      font-size: 2rem;
      font-weight: 700;
      display: grid;
      place-items: center;
    }

    /* Mobile Utility */
    .mobile-menu-btn {
      display: none;
      background: transparent;
      border: none;
      font-size: 1.5rem;
      color: var(--text-main);
      cursor: pointer;
    }

    @media (max-width: 768px) {
      aside {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        transform: translateX(-100%);
        box-shadow: 20px 0 50px rgba(0, 0, 0, 0.3);
      }

      aside.open {
        transform: translateX(0);
      }

      .mobile-menu-btn {
        display: block;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="brand">
      <button class="mobile-menu-btn" id="menuToggle">☰</button>
      <div class="brand-icon">D</div>
      <span>Public Tools</span>
    </div>
    <div style="display:flex; gap:12px;">
      <button class="action-btn" id="btnShare" title="Share Link">
        <span>🔗</span> Share
      </button>
      <button class="theme-toggle" id="themeToggle" title="Toggle Theme">
        ☀
      </button>
    </div>
  </header>

  <div class="layout">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Search tools...">
      </div>
      <div class="tool-list" id="toolList">
        <!-- Tools injected here -->
      </div>
    </aside>

    <!-- Main Content -->
    <main>
      <!-- Overlay for mobile sidebar -->
      <div id="overlay" style="display:none; position:absolute; inset:0; background:rgba(0,0,0,0.5); z-index:30;"
        onclick="toggleSidebar()"></div>

      <div class="content-header" id="contentHeader">
        <div class="content-title" id="pageTitle">Welcome</div>
        <div style="display:flex; gap:8px;">
          <button class="action-btn" id="btnRefresh" title="Refresh List">↻ Sync</button>
          <button class="action-btn primary" id="btnOpenExternal" disabled>Open New Tab ↗</button>
        </div>
      </div>

      <div class="frame-container">
        <!-- About Section -->
        <div id="aboutSection" class="about-section">
          <div style="max-width: 600px; margin: 60px auto; text-align: center;">
            <div class="profile-avatar"
              style="width: 100px; height: 100px; font-size: 2.5rem; margin: 0 auto 24px auto; box-shadow: var(--shadow-lg);">
              DA</div>

            <h1 style="font-family: var(--font-head); font-size: 2rem; margin: 0 0 8px 0; color: var(--text-main);">Daud
              Aldumy</h1>

            <div
              style="display:inline-block; background: var(--primary-glow); color: var(--primary); padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; margin-bottom: 24px;">
              Cybersecurity Engineer · AppSec Specialist
            </div>

            <p style="color: var(--text-muted); font-size: 1.05rem; line-height: 1.6; margin-bottom: 32px;">
              Specializing in Red Teaming and Bug Bounty Hunting. <br>
              This dashboard hosts my personal collection of client-side security utilities designed for privacy and
              reconnaissance.
            </p>

            <div style="display: flex; gap: 12px; justify-content: center;">
              <a href="https://me.daudaldi.my.id/" target="_blank" class="action-btn">🌐 Portfolio</a>
              <a href="https://github.com/mrdzer0" target="_blank" class="action-btn">🐙 GitHub</a>
              <a href="https://linkedin.com/in/daudaldi" target="_blank" class="action-btn">💼 LinkedIn</a>
            </div>
          </div>
        </div>

        <!-- Iframe for Tools -->
        <iframe id="toolFrame" style="display:none;"></iframe>
      </div>
    </main>
  </div>

  <script>
    // --- Configuration ---
    const CONFIG = {
      OWNER: "daudaldi",
      REPO: "daudaldi.github.io"
    };

    // --- State ---
    const state = {
      tools: [],
      currentId: 'about',
      theme: localStorage.getItem('theme') || 'light'
    };

    // --- Elements ---
    const $ = id => document.getElementById(id);
    const els = {
      body: document.body,
      themeBtn: $('themeToggle'),
      list: $('toolList'),
      searchInput: $('searchInput'),
      sidebar: $('sidebar'),
      overlay: $('overlay'),
      about: $('aboutSection'),
      frame: $('toolFrame'),
      headerTitle: $('pageTitle'),
      btnOpen: $('btnOpenExternal'),
      btnRefresh: $('btnRefresh')
    };

    // --- Theme Logic ---
    function initTheme() {
      els.body.setAttribute('data-theme', state.theme);
      updateThemeIcon();
      updateIframeTheme();
    }

    function toggleTheme() {
      state.theme = state.theme === 'light' ? 'dark' : 'light';
      localStorage.setItem('theme', state.theme);
      els.body.setAttribute('data-theme', state.theme);
      updateThemeIcon();
      updateIframeTheme();
    }

    function updateThemeIcon() {
      els.themeBtn.innerHTML = state.theme === 'light' ? '☀' : '🌙';
    }

    function updateIframeTheme() {
      if (els.frame && els.frame.contentWindow) {
        els.frame.contentWindow.postMessage({ type: 'theme', theme: state.theme }, '*');
      }
    }

    els.frame.onload = updateIframeTheme;

    // --- Discovery Logic ---
    async function fetchTools() {
      els.btnRefresh.innerHTML = '...';

      let fetchedTools = [];
      // Hardcoded local tools to ensure they always appear
      const localTools = [
        { id: 'dork_generator.html', name: 'Dork Generator', url: 'tools/dork_generator.html', category: 'Infosec Support', icon: '🔍' },
        { id: 'punycode_pro.html', name: 'Punycode Pro', url: 'tools/punycode_pro.html', category: 'Infosec Support', icon: '🌐' }
        { id: 'reportgen.html', name: 'Report Generate', url: 'tools/reportgen.html', category: 'Infosec Support', icon: '🌐' }
      ];

      try {
        if (CONFIG.OWNER) {
          const api = `https://api.github.com/repos/${CONFIG.OWNER}/${CONFIG.REPO}/contents/tools?ref=main`;
          const res = await fetch(api);

          if (res.ok) {
            const files = await res.json();
            fetchedTools = files
              .filter(f => f.name.endsWith('.html') && f.name !== 'index.html')
              .map(f => ({
                id: f.name,
                name: formatName(f.name),
                url: `tools/${f.name}`,
                category: categorize(f.name),
                icon: getIcon(f.name)
              }));
          }
        }
      } catch (e) {
        console.error(e);
      }

      // Merge strategies (using a Map to deduplicate by ID)
      const toolsMap = new Map();

      // Add API tools first
      fetchedTools.forEach(t => toolsMap.set(t.id, t));

      // Add/Override local tools (ensure they exist and have correct categories)
      localTools.forEach(t => toolsMap.set(t.id, t));

      // Fallback checks
      if (toolsMap.size === 0) {
        [
          { id: 'nik.html', name: 'Identity (NIK) Parser', url: 'tools/nik.html', category: 'Citizen Utilities', icon: '🪪' },
          { id: 'nopol.html', name: 'Plate Number', url: 'tools/nopol.html', category: 'Citizen Utilities', icon: '🚗' },
          { id: 'watermark.html', name: 'Secure Watermark', url: 'tools/watermark.html', category: 'Citizen Utilities', icon: '©' },
          ...localTools
        ].forEach(t => toolsMap.set(t.id, t));
      }

      state.tools = Array.from(toolsMap.values());

      // Re-categorize everything to be safe
      state.tools.forEach(t => {
        if (!t.category) t.category = categorize(t.id);
      });

      renderList();
      els.btnRefresh.innerHTML = '↻ Sync';

      // Check URL param
      const params = new URLSearchParams(window.location.search);
      const toolId = params.get('id');
      if (toolId) selectTool(toolId);
    }

    function formatName(filename) {
      return filename
        .replace('.html', '')
        .replace(/_/g, ' ')
        .replace(/-/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    function categorize(filename) {
      const n = filename.toLowerCase();
      if (n.includes('dork') || n.includes('puny') || n.includes('recon') || n.includes('scan')) return 'Infosec Support';
      if (n.includes('nik') || n.includes('nopol') || n.includes('watermark') || n.includes('id')) return 'Citizen Utilities';
      return 'Other Tools';
    }

    function getIcon(filename) {
      const n = filename.toLowerCase();
      if (n.includes('dork')) return '🔍';
      if (n.includes('puny') || n.includes('idn')) return '🌐';
      if (n.includes('nik') || n.includes('identity')) return '🪪';
      if (n.includes('watermark')) return '©';
      if (n.includes('nopol') || n.includes('plate')) return '🚗';
      return '🔧';
    }

    // --- Rendering ---
    function renderList() {
      els.list.innerHTML = '';

      // 1. Dashboard / About (Always Top)
      const aboutItem = createToolItem({ id: 'about', name: 'About & Profile', icon: '👤' });
      els.list.appendChild(aboutItem);

      // 2. Group Tools by Category
      const searchTerm = els.searchInput.value.toLowerCase();
      const grouped = {};

      state.tools.forEach(t => {
        if (t.name.toLowerCase().includes(searchTerm)) {
          if (!grouped[t.category]) grouped[t.category] = [];
          grouped[t.category].push(t);
        }
      });

      // 3. Render Groups (Order: Infosec Support, Citizen Utilities, Other)
      const order = ['Infosec Support', 'Citizen Utilities', 'Other Tools'];
      const categories = Object.keys(grouped).sort((a, b) => {
        let ia = order.indexOf(a);
        let ib = order.indexOf(b);
        if (ia === -1) ia = 99;
        if (ib === -1) ib = 99;
        return ia - ib;
      });

      categories.forEach(cat => {
        // Category Header
        const header = document.createElement('div');
        header.className = 'tool-category';
        header.innerText = cat;
        els.list.appendChild(header);

        // Items in Category
        grouped[cat].forEach(tool => {
          els.list.appendChild(createToolItem(tool));
        });
      });

      if (state.tools.length > 0 && Object.keys(grouped).length === 0) {
        els.list.innerHTML += '<div style="padding:20px; text-align:center; color:var(--text-muted)">No tools found</div>';
      }
    }

    function createToolItem(tool) {
      const div = document.createElement('div');
      div.className = `tool-item ${state.currentId === tool.id ? 'active' : ''}`;
      div.onclick = () => selectTool(tool.id);

      div.innerHTML = `
            <div class="tool-icon">${tool.icon || '🔧'}</div>
            <div class="tool-info">
                <div class="tool-name">${tool.name}</div>
            </div>
        `;
      return div;
    }

    function selectTool(id) {
      state.currentId = id;
      renderList(); // Re-render active state

      // Close mobile sidebar
      els.sidebar.classList.remove('open');
      els.overlay.style.display = 'none';

      // Update URL
      const url = new URL(window.location);
      if (id === 'about') {
        url.searchParams.delete('id');
        els.about.style.display = 'block';
        els.frame.style.display = 'none';
        els.headerTitle.innerText = "Welcome";
        els.btnOpen.disabled = true;
      } else {
        const tool = state.tools.find(t => t.id === id);
        if (!tool) return; // Error handling

        url.searchParams.set('id', id);
        els.about.style.display = 'none';
        els.frame.style.display = 'block';
        els.frame.src = tool.url;
        els.headerTitle.innerText = tool.name;
        els.btnOpen.disabled = false;
        els.btnOpen.onclick = () => window.open(tool.url, '_blank');
      }
      history.pushState({}, '', url);
    }

    // --- Event Listeners ---
    els.themeBtn.addEventListener('click', toggleTheme);
    els.btnRefresh.addEventListener('click', fetchTools);

    $('menuToggle').addEventListener('click', toggleSidebar);

    function toggleSidebar() {
      els.sidebar.classList.toggle('open');
      els.overlay.style.display = els.sidebar.classList.contains('open') ? 'block' : 'none';
    }

    els.searchInput.addEventListener('input', renderList);

    $('btnShare').addEventListener('click', () => {
      navigator.clipboard.writeText(window.location.href);
      const btn = $('btnShare');
      const original = btn.innerHTML;
      btn.innerHTML = '✅ Copied';
      setTimeout(() => btn.innerHTML = original, 2000);
    });

    // --- Init ---
    initTheme();
    fetchTools();

  </script>
</body>

</html>
